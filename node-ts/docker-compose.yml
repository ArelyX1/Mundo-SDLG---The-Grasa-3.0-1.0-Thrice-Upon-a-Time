name: sdlg-jam-local

# Red local de 4 validadores SDLG-JAM.
# Pre-requisito: generar genesis + wallets:
#   npm run dev -- init --validators 4 --users 3 --out ./genesis --seed ws://validator-0:30334
# Levantar:
#   ./scripts/local-demo.sh   (o: docker compose up --build)

services:
  validator-0:
    build: .
    image: sdlg-jam:0.1.0
    container_name: validator-0
    command: ["start", "--node", "validator-0"]
    environment:
      JAM_NETWORK: sdlg-jam
      JAM_GENESIS: /app/genesis/genesis.json
      JAM_WALLET_DIR: /app/wallets
      JAM_DATA_DIR: /app/data
      JAM_LISTEN_ALL: "true"
      JAM_TIMESLOT_SECS: "6"
      JAM_P2P_PORT: "30334"
      JAM_RPC_PORT: "9944"
      JAM_API_PORT: "8080"
      JAM_EVM_PORT: "8545"
      JAM_LOG_LEVEL: info
    ports:
      - "30334:30334"   # p2p
      - "9944:9944"     # json-rpc
      - "8080:8080"     # economia API
      - "8545:8545"     # EVM RPC (MetaMask)
    volumes:
      - ./genesis:/app/genesis:ro
      - ./wallets:/app/wallets
      - ./data/v0:/app/data
    restart: unless-stopped

  validator-1:
    image: sdlg-jam:0.1.0
    depends_on: [validator-0]
    command: ["start", "--node", "validator-1"]
    environment:
      JAM_NETWORK: sdlg-jam
      JAM_GENESIS: /app/genesis/genesis.json
      JAM_WALLET_DIR: /app/wallets
      JAM_DATA_DIR: /app/data
      JAM_LISTEN_ALL: "true"
      JAM_TIMESLOT_SECS: "6"
      JAM_P2P_PORT: "30335"
      JAM_RPC_PORT: "9945"
      JAM_API_PORT: "8081"
      JAM_EVM_PORT: "8546"
      JAM_SEED_PEERS: ws://validator-0:30334
    ports:
      - "30335:30335"
      - "9945:9945"
      - "8081:8081"
      - "8546:8546"     # EVM RPC (MetaMask)
    volumes:
      - ./genesis:/app/genesis:ro
      - ./wallets:/app/wallets
      - ./data/v1:/app/data
    restart: unless-stopped

  validator-2:
    image: sdlg-jam:0.1.0
    depends_on: [validator-0]
    command: ["start", "--node", "validator-2"]
    environment:
      JAM_NETWORK: sdlg-jam
      JAM_GENESIS: /app/genesis/genesis.json
      JAM_WALLET_DIR: /app/wallets
      JAM_DATA_DIR: /app/data
      JAM_LISTEN_ALL: "true"
      JAM_TIMESLOT_SECS: "6"
      JAM_P2P_PORT: "30336"
      JAM_RPC_PORT: "9946"
      JAM_API_PORT: "8082"
      JAM_EVM_PORT: "8547"
      JAM_SEED_PEERS: ws://validator-0:30334
    ports:
      - "30336:30336"
      - "9946:9946"
      - "8082:8082"
      - "8547:8547"     # EVM RPC (MetaMask)
    volumes:
      - ./genesis:/app/genesis:ro
      - ./wallets:/app/wallets
      - ./data/v2:/app/data
    restart: unless-stopped

  validator-3:
    image: sdlg-jam:0.1.0
    depends_on: [validator-0]
    command: ["start", "--node", "validator-3"]
    environment:
      JAM_NETWORK: sdlg-jam
      JAM_GENESIS: /app/genesis/genesis.json
      JAM_WALLET_DIR: /app/wallets
      JAM_DATA_DIR: /app/data
      JAM_LISTEN_ALL: "true"
      JAM_TIMESLOT_SECS: "6"
      JAM_P2P_PORT: "30337"
      JAM_RPC_PORT: "9947"
      JAM_API_PORT: "8083"
      JAM_EVM_PORT: "8548"
      JAM_SEED_PEERS: ws://validator-0:30334
    ports:
      - "30337:30337"
      - "9947:9947"
      - "8083:8083"
      - "8548:8548"     # EVM RPC (MetaMask)
    volumes:
      - ./genesis:/app/genesis:ro
      - ./wallets:/app/wallets
      - ./data/v3:/app/data
    restart: unless-stopped