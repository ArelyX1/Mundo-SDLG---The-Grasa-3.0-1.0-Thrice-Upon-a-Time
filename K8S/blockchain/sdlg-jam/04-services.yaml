apiVersion: v1
kind: Service
metadata:
  name: sdlg-jam-validator-0
  namespace: "2023241041"
  labels:
    app: sdlg-jam
    node: validator-0
spec:
  type: ClusterIP
  selector:
    app: sdlg-jam
    node: validator-0
  ports:
    # P2P: los demas validators conectan saliente a ws://sdlg-jam-validator-0.2023241041.svc.cluster.local:30334
    - { name: p2p, port: 30334, targetPort: 30334, protocol: TCP }
    - { name: rpc, port: 9944, targetPort: 9944, protocol: TCP }
    - { name: api, port: 8080, targetPort: 8080, protocol: TCP }
    - { name: evm, port: 8545, targetPort: 8545, protocol: TCP }

# Para exponer a internet SIN ip publica se usa un tunnel (ver 06-tunnel-cloudflared.yaml),
# que apunta al NodePort por IP del nodo (http://IP:32545), no al nombre interno.
#
# Si en algun momento tenes un Cloud Provider con LoadBalancer, descomenta:
# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: sdlg-jam-external
#   namespace: 2023241041
# spec:
#   type: LoadBalancer
#   selector:
#     app: sdlg-jam
#     node: validator-0
#   ports:
#     - { name: evm, port: 8545, targetPort: 8545, protocol: TCP }
#     - { name: rpc, port: 9944, targetPort: 9944, protocol: TCP }
#     - { name: api, port: 8080, targetPort: 8080, protocol: TCP }

# Bare-metal sin LB: NodePort en la IP de cualquier nodo del cluster
# (ej: curl http://172.16.10.31:32545)
---
apiVersion: v1
kind: Service
metadata:
  name: sdlg-jam-nodeport
  namespace: "2023241041"
  labels:
    app: sdlg-jam
    node: validator-0
spec:
  type: NodePort
  selector:
    app: sdlg-jam
    node: validator-0
  ports:
    - { name: evm, port: 8545, nodePort: 32545, targetPort: 8545, protocol: TCP }
    - { name: rpc, port: 9944, nodePort: 32244, targetPort: 9944, protocol: TCP }
    - { name: api, port: 8080, nodePort: 32080, targetPort: 8080, protocol: TCP }